<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veille IA — l'actualité de l'IA, triée et résumée chaque jour</title>
<meta name="description" content="Claude, les agents, les modèles et l'agentic coding : collectés, notés et résumés automatiquement, tous les matins.">
<!-- L'icône est une donnée en ligne, et non un fichier à côté : le fichier local
     reste un fichier unique, qui s'ouvre hors ligne. Le site publié, lui, sert ses
     fontes en fichiers voisins pour ne pas les renvoyer chaque matin — depuis son
     propre domaine, jamais depuis un tiers. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f8f6f1'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%239a6410'/%3E%3C/svg%3E">
<!-- L'aperçu de partage, lui, ne peut pas l'être : aucun robot ne résout une image
     en data: ni en chemin relatif. Ces balises ne valent donc que sur le site publié,
     et __URL__ y est remplacée à la construction. -->
<meta property="og:type" content="website">
<meta property="og:locale" content="fr_FR">
<meta property="og:site_name" content="Veille IA">
<meta property="og:title" content="Veille IA — l'actualité de l'IA, triée et résumée chaque jour">
<meta property="og:description" content="Claude, les agents, les modèles et l'agentic coding : collectés, notés et résumés automatiquement, tous les matins.">
<meta property="og:url" content="__URL__/">
<meta property="og:image" content="__URL__/partage.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="alternate" type="application/rss+xml" title="Veille IA — l'essentiel du jour" href="__URL__/flux.xml">
<style>
__STYLE__
</style>
</head>
<body>

<div class="etat">
  <span class="nom"><span class="point"></span>Veille IA</span>
  <span id="resume"></span>
  <span class="droite">
    <div class="onglets" id="onglets" role="tablist"></div>
    <button id="sauver" hidden title="Télécharge un fichier favoris-....json, repris à la prochaine synchronisation">Sauvegarder</button>
    <button id="cle" hidden title="Votre clé Gemini, pour développer un article">Clé API</button>
  </span>
</div>

<header>
  <div class="bandeau">
    <div class="nav-jour" id="nav-jour">
      <button class="fleche" id="prec" aria-label="Jour précédent" title="Jour précédent (flèche gauche)">&lsaquo;</button>
      <button class="fleche" id="suiv" aria-label="Jour suivant" title="Jour suivant (flèche droite)">&rsaquo;</button>
      <button id="datejour" aria-haspopup="dialog" aria-expanded="false" title="Choisir une date"></button>
      <span class="aide"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> changent de jour</span>
      <button id="tousjours" aria-pressed="false" title="Empiler toutes les journées, comme avant">Tout</button>
      <div class="calendrier" id="calendrier" role="dialog" aria-label="Choisir une date" hidden></div>
    </div>
    <div class="nav-jour" id="nav-semaine" hidden>
      <button class="fleche" id="sem-prec" aria-label="Semaine précédente" title="Semaine précédente (flèche gauche)">&lsaquo;</button>
      <button class="fleche" id="sem-suiv" aria-label="Semaine suivante" title="Semaine suivante (flèche droite)">&rsaquo;</button>
      <button id="sem-libelle" aria-haspopup="listbox" aria-expanded="false" title="Choisir une semaine"></button>
      <div class="calendrier liste-semaines" id="liste-semaines" role="listbox" aria-label="Choisir une semaine" hidden></div>
    </div>
    <h1 class="titraille" id="titraille">Veille IA</h1>
    <p class="compteurs" id="compteurs"></p>
    <p class="reprise" id="reprise" hidden></p>
    <div class="outils">
      <input id="recherche" type="search" placeholder="Rechercher un titre, une source…" autocomplete="off">
      <select id="tri" aria-label="Ordre de tri">
        <option value="pertinence">Pertinence</option>
        <option value="date">Plus récent</option>
        <option value="date-inverse">Plus ancien</option>
      </select>
    </div>
  </div>
  <div class="filtres voies" id="voies"></div>
  <div class="filtres" id="filtres"></div>
  <div class="bandeau-public" id="bandeau" hidden></div>
  <div class="panneau-cle" id="panneau-cle" hidden></div>
</header>

<div class="colonnes">
  <main id="flux"></main>
  <aside class="rail" id="rail" hidden></aside>
</div>

<script id="donnees" type="application/json">__DONNEES__</script>
<script>
__SCRIPT__
</script>
</body>
</html>
