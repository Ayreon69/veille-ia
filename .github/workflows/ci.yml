# Contrôles du dépôt public. Aucun appel de modèle, aucun réseau : les tests
# travaillent sur des données construites à la main, et le vault n'existe pas ici.
name: Contrôles

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  controles:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: |
          pip install -q -r requirements.txt
          pip install -q pytest ruff

      - name: Lint
        run: ruff check .

      - name: Tests
        run: python -m pytest -q
