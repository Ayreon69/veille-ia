# Worker de lecture d'articles — voir lecture.js pour ce qu'il fait et ne fait pas.
#
# Déploiement :
#   npm install -g wrangler
#   wrangler login
#   wrangler deploy
#
# Puis renseigner l'origine réelle du site public dans [vars].SITE ci-dessous, et
# reporter l'adresse du Worker dans .veille/.env :
#   VEILLE_WORKER_LECTURE=https://veille-lecture.<compte>.workers.dev

name = "veille-lecture"
main = "lecture.js"
compatibility_date = "2026-08-01"

[vars]
# Origine du site public. Sert de source pour la liste blanche (SITE/urls.json) et
# d'origine autorisée en CORS. Renseignée le 2026-09-17, après création du projet
# Pages : `veille-ia` était déjà pris par un tiers.
SITE = "https://veille-ia-rj.pages.dev"

[observability]
enabled = true
