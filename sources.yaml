# Posts X de Boris Cherny, Cat Wu, Thariq, Alex Albert, @claudeai… et d'une vingtaine
# d'autres (Karpathy, swyx, Codex, Vercel). Flux JSON public du projet follow-builders,
# régénéré chaque matin vers 06 h 40 UTC — avant notre exécution. Voir veille/reseaux.py.
- id: x_builders
  nom: X — builders (follow-builders)
  type: follow_builders
  url: https://raw.githubusercontent.com/zarazhangrui/follow-builders/main/feed-x.json
  categorie: x
  poids: 2
  actif: true
  # Un post est une affirmation de son auteur, pas un fait vérifié.
  titre_utilisateur: true
  extrait_max: 1500
  params:
    depot: zarazhangrui/follow-builders
    # Investisseurs et dirigeants hors technique : hors profil.
    exclure: [mattturck, garrytan, adityaag, nikunj, levie, zarazhangrui]
    min_caracteres: 50

# Les comptes que follow-builders ne suit pas — Lydia Hallie, Noah Zweben, @ClaudeDevs —
# et ceux de l'équipe Claude Code, en direct pour ne pas dépendre de ses crédits.
# API officielle, payée au post lu (0,005 $) : ~20 posts/jour ≈ 3 $/mois.
# Dormante tant que le secret X_BEARER_TOKEN n'existe pas — voir Sources.md.
- id: x_claude_code
  nom: X — équipe Claude Code
  type: x_api
  url: https://api.x.com/2/tweets/search/recent
  categorie: x
  poids: 3
  actif: true
  requiert_env: X_BEARER_TOKEN
  titre_utilisateur: true
  extrait_max: 4000
  params:
    comptes: [lydiahallie, trq212, bcherny, _catwu, noahzweben, alexalbert__, adocomplete, ClaudeDevs]
    max_par_compte: 10
    min_caracteres: 50

