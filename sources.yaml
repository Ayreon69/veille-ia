- id: hackernews
  nom: Hacker News
  type: hn
  url: https://hn.algolia.com/api/v1/search_by_date
  categorie: agregateur
  poids: 2
  actif: true
  params:
    # Une requête Algolia par mot-clé, puis fusion et déduplication.
    mots_cles: [LLM, "Claude", "Anthropic", "OpenAI", "agentic", "MCP"]
    # Seuil de score : sous cette barre, c'est du bruit.
    min_points: 30
  # Titre rédigé par un utilisateur : affirmation, pas fait vérifié.
  titre_utilisateur: true


