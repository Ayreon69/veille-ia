# Mesuré sur les 19 premiers jours d'archive (07/08 → 22/08/2026), scores du modèle
# à l'appui. Les sept sources désactivées représentaient 26 % du volume collecté pour
# 5 % des éléments jugés utiles. Le critère est le RENDEMENT, jamais le volume : des
# sources qui ne publient que deux fois par mois sont conservées quand ce qu'elles
# publient est bon — Anthropic News, Mistral AI, les deux flux MCP.
#
# `actif: false` conserve la configuration : une seule ligne suffit à revenir dessus.

# Sources de la veille IA
# Vérifiées le 2026-08-07 (code HTTP + présence d'items + date du dernier post).
# La note de référence est "Veille IA/Sources.md" dans le vault Obsidian.
#
# type    : rss | scrape_anthropic | scrape_the_batch | hn
# poids   : 3 = fort signal (prioritaire au tri), 2 = utile, 1 = complément bruyant
# actif   : passer à false pour désactiver sans supprimer la config

- id: anthropic
  nom: Anthropic News
  type: scrape_anthropic
  url: https://www.anthropic.com/news
  categorie: labs
  poids: 3
  actif: true

# Distinct d'anthropic.com/news, qui ne porte que le corporate. C'est ICI que
# paraissent les annonces produit et Claude Code — priorité n°1 du profil.
- id: claude_blog
  nom: Claude Blog (produit)
  type: scrape_claude_blog
  url: https://claude.com/blog
  categorie: labs
  poids: 3
  actif: true

# La documentation n'a pas de flux. Le sitemap sert à repérer les pages
# nouvellement publiées : la déduplication garantit qu'une page ne remonte qu'une
# fois, donc les retouches de coquilles ne polluent pas le digest.
- id: claude_code_docs
  nom: Claude Code (documentation)
  type: sitemap
  url: https://code.claude.com/docs/sitemap.xml
  categorie: outils
  poids: 3
  actif: true
  params:
    # Sans ce filtre, chaque page remonterait dans une dizaine de traductions.
    filtre_url: /docs/en/

