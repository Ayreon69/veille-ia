# Ruff seul : le projet n'est pas un paquet installable, il s'exécute depuis sa racine.
[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E501 (longueur de ligne) est laissé à `line-length`; les commentaires explicatifs
# du projet sont longs par choix.
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
